<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  
  <!-- Outer Neon Ring -->
  <circle cx="256" cy="256" r="226" fill="none" stroke="url(#ringGrad)" stroke-width="12" stroke-dasharray="16 8"/>
  <circle cx="256" cy="256" r="214" fill="#090d16" stroke="#1e293b" stroke-width="4"/>

  <!-- Tuxedo Penguin Mascot -->
  <!-- Penguin Body -->
  <ellipse cx="256" cy="285" rx="105" ry="135" fill="#020617" stroke="#1e293b" stroke-width="3"/>
  <!-- White Shirt Chest -->
  <ellipse cx="256" cy="290" rx="60" ry="98" fill="#f8fafc"/>

  <!-- Black Tuxedo Lapels -->
  <polygon points="196,215 256,335 215,375 180,265" fill="#020617"/>
  <polygon points="316,215 256,335 297,375 332,265" fill="#020617"/>

  <!-- Crimson Bowtie -->
  <polygon points="230,240 256,252 230,264" fill="#e11d48"/>
  <polygon points="282,240 256,252 282,264" fill="#e11d48"/>
  <circle cx="256" cy="252" r="9" fill="#be123c"/>

  <!-- Tuxedo Buttons -->
  <circle cx="256" cy="282" r="5" fill="#020617"/>
  <circle cx="256" cy="310" r="5" fill="#020617"/>

  <!-- Head -->
  <circle cx="256" cy="180" r="68" fill="#020617"/>

  <!-- Sunglasses -->
  <rect x="202" y="166" width="46" height="26" rx="8" fill="#090d16" stroke="#38bdf8" stroke-width="4"/>
  <rect x="264" y="166" width="46" height="26" rx="8" fill="#090d16" stroke="#38bdf8" stroke-width="4"/>
  <line x1="248" y1="178" x2="264" y2="178" stroke="#38bdf8" stroke-width="4"/>
  <!-- Sunglass Specular Reflection -->
  <line x1="210" y1="174" x2="232" y2="174" stroke="#93c5fd" stroke-width="3"/>

  <!-- Orange Beak -->
  <polygon points="242,192 270,192 256,214" fill="#f59e0b" stroke="#d97706" stroke-width="2"/>

  <!-- Orange Feet -->
  <ellipse cx="218" cy="420" rx="30" ry="15" fill="#f59e0b" stroke="#d97706" stroke-width="2"/>
  <ellipse cx="294" cy="420" rx="30" ry="15" fill="#f59e0b" stroke="#d97706" stroke-width="2"/>

  <!-- Soccer Ball -->
  <circle cx="342" cy="395" r="32" fill="#ffffff" stroke="#090d16" stroke-width="3"/>
  <polygon points="342,382 352,389 348,402 336,402 332,389" fill="#090d16"/>
  <line x1="342" y1="382" x2="342" y2="365" stroke="#090d16" stroke-width="2"/>
  <line x1="352" y1="389" x2="368" y2="382" stroke="#090d16" stroke-width="2"/>
  <line x1="348" y1="402" x2="362" y2="416" stroke="#090d16" stroke-width="2"/>
  <line x1="336" y1="402" x2="322" y2="416" stroke="#090d16" stroke-width="2"/>
  <line x1="332" y1="389" x2="316" y2="382" stroke="#090d16" stroke-width="2"/>

  <!-- Stars -->
  <polygon points="120,110 125,125 140,125 128,135 132,150 120,140 108,150 112,135 100,125 115,125" fill="url(#goldGrad)"/>
  <polygon points="392,110 397,125 412,125 400,135 404,150 392,140 380,150 384,135 372,125 387,125" fill="url(#goldGrad)"/>

  <!-- Top Text Arc / Banner -->
  <rect x="156" y="58" width="200" height="28" rx="6" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="2"/>
  <text x="256" y="78" font-family="monospace" font-weight="900" font-size="16" fill="#fde047" text-anchor="middle" letter-spacing="3">TUXEDO PENGUIN</text>

  <!-- Bottom Text Banner -->
  <rect x="136" y="440" width="240" height="32" rx="6" fill="#0f172a" stroke="#22c55e" stroke-width="2"/>
  <text x="256" y="462" font-family="monospace" font-weight="900" font-size="14" fill="#38bdf8" text-anchor="middle" letter-spacing="2">RETRO STRIKER '94</text>
</svg>
